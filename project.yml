name: TrackpadRemote
options:
  bundleIdPrefix: com.hyunholee
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # A stable signing identity is not cosmetic here: TCC pins the Accessibility
    # grant to the ad-hoc CDHash, which changes on every build, so an ad-hoc
    # signed server loses the grant each rebuild while still showing as enabled
    # in System Settings. An Apple Development identity gives a stable
    # requirement (team + bundle id) that survives rebuilds.
    DEVELOPMENT_TEAM: QGAQ3AY3R3
    CODE_SIGN_STYLE: Automatic
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  TrackpadRemote:
    type: application
    platform: iOS
    sources:
      - path: iOS
      - path: Shared
      - path: Resources/Assets-iOS.xcassets
    info:
      path: Resources/TrackpadRemote-Info.plist
      properties:
        CFBundleDisplayName: Trackpad
        LSApplicationCategoryType: public.app-category.utilities
        UILaunchScreen: {}
        # Landscape only: the pad is a 1:1 scale model of a landscape desktop,
        # so a portrait surface would waste most of the screen.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: Connects to your Mac over the local network to act as a trackpad.
        NSBonjourServices:
          - _trackpad-rc._tcp
          - _trackpad-rc._udp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leeo.TrackpadRemote
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES

  TrackpadServer:
    type: application
    platform: macOS
    sources:
      - path: macOS
      - path: Shared
      - path: Resources/Assets-macOS.xcassets
    info:
      path: Resources/TrackpadServer-Info.plist
      properties:
        CFBundleDisplayName: TrackpadServer
        # Required by App Store Connect validation, and Finder/Launch Services
        # use it to file the app. Utilities is the right bucket for a menu bar
        # input helper.
        LSApplicationCategoryType: public.app-category.utilities
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSLocalNetworkUsageDescription: Receives trackpad input from your iPhone over the local network.
        NSBonjourServices:
          - _trackpad-rc._tcp
          - _trackpad-rc._udp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hyunholee.TrackpadServer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Resources/TrackpadServer.entitlements
